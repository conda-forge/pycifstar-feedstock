context:
  name: pycifstar
  version: "0.3.1"
  python_min: "3.9" # https://github.com/prefix-dev/rattler-build/pull/1122

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pycifstar-${{ version }}.tar.gz
  sha256: f01543b19ca441be40cef9d2806eda3a43a3085477b85519df7e0c2905b5f1f8

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - script: python -c "import pycifstar"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  summary: PyCifStar is a class library for data manipulation provided in the CIF/STAR File.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/ikibalin/pycifstar

extra:
  recipe-maintainers:
    - conda-forge/easyscience
    - MridulS
