context:
  name: pycifstar
  version: "0.3.2"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/pycifstar-${{ version }}.tar.gz
  sha256: c63be0fd6ff4c1a678d598864a225aa616162a2bf2deb9656ecc9c79b0e1f82a

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}

tests:
  - script: python -c "import pycifstar"
    requirements:
      run:
        - python ${{ python_min }}.*

about:
  summary: PyCifStar is a class library for data manipulation provided in the CIF/STAR File.
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/ikibalin/pycifstar

extra:
  recipe-maintainers:
    - conda-forge/easyscience
    - MridulS
